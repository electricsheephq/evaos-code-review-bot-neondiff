name: Swift CodeQL Path-Aware

on:
  workflow_dispatch:
  schedule:
    - cron: "37 9 * * 1"

permissions:
  actions: read
  contents: read

concurrency:
  group: swift-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-swift:
    name: Analyze Swift (path-aware)
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v3
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Manual SwiftPM build
        working-directory: apps/neondiff-desktop
        run: swift build --product NeonDiffDesktop

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v3
        with:
          category: "/language:swift"
          upload: false
          upload-database: false
          wait-for-processing: false

      - name: Summarize advisory Swift CodeQL boundary
        if: always()
        run: |
          {
            echo "## Swift CodeQL advisory run"
            echo
            echo "This workflow runs Swift CodeQL extraction and queries, but does not upload SARIF."
            echo
            echo "Policy: Swift CodeQL is scheduled/manual release-security evidence, not a required PR velocity gate."
            echo "Reason: GitHub rejected advanced CodeQL SARIF uploads while repository default setup is enabled."
            echo "See docs/swift-codeql-policy.md and #393 for the long-term default-vs-advanced CodeQL decision."
          } >> "$GITHUB_STEP_SUMMARY"
