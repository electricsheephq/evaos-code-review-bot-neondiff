name: Pre-publication privacy audit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Scan source and public GitHub text
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_PRIVACY_BLOCKLIST_B64: ${{ secrets.PUBLICATION_PRIVACY_BLOCKLIST_B64 }}
        run: node scripts/check-publication-privacy.mjs
